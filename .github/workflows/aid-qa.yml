name: AID clinical QA

on:
  push:
    branches:
      - "codex/**"
      - "aid/**"
      - "release/**"
  pull_request:
    branches: [main]

jobs:
  clinical-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run golden + regression tests
        run: npm test
